name: CycloneDX 1.7 CBOM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-cbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install @cyclonedx/cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate CycloneDX 1.7 CBOM (JS + C/C++20 deep crypto scan)
        run: |
          cdxgen \
            --spec-version 1.7 \
            --deep \
            --include-crypto \
            -o cbom.json \
            .

      - name: Enrich CRA/CISA manufacturer & security contact metadata
        run: |
          jq '
            .metadata.manufacturer = {
              "name": "ZeroLabz",
              "url": ["https://zrolabz.com"],
              "contact": [{"name": "ZeroLabz Security", "email": "dev@zrolabz.com"}]
            } |
            .metadata.supplier = {
              "name": "ZeroLabz",
              "url": ["https://zrolabz.com"],
              "contact": [{"name": "ZeroLabz Security", "email": "dev@zrolabz.com"}]
            }
          ' cbom.json > cbom.enriched.json
          mv cbom.enriched.json cbom.json

      - name: Validate CBOM against CycloneDX 1.7 schema
        run: |
          set +e
          cdx-validate -i cbom.json
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 3 ]; then
            echo "::warning::cdx-validate reported compliance scorecard findings (exit code 3); schema validation passed."
          elif [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi

      - name: Summarize detected cryptographic assets
        run: |
          jq '[.components[]? | select(.type == "cryptographic-asset") | {
            name,
            assetType: .cryptoProperties.assetType,
            primitive: .cryptoProperties.algorithmProperties.primitive,
            quantumLevel: .cryptoProperties.algorithmProperties.nistQuantumSecurityLevel
          }]' cbom.json

      - name: Upload CycloneDX CBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-wire-native-cbom-${{ github.sha }}
          path: cbom.json
          retention-days: 90
