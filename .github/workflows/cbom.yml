name: CycloneDX 1.7 CBOM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-cbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install @cyclonedx/cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate CycloneDX 1.7 CBOM
        run: |
          cdxgen \
            --spec-version 1.7 \
            --deep \
            --include-crypto \
            -o cbom.json \
            .

      - name: Enrich CRA/CISA metadata & vendored cryptographic assets
        run: |
          jq '
            .metadata.manufacturer = {
              "name": "ZeroLabz",
              "url": ["https://zrolabz.com"],
              "contact": [{"name": "ZeroLabz Security", "email": "dev@zrolabz.com"}]
            } |
            .metadata.supplier = {
              "name": "ZeroLabz",
              "url": ["https://zrolabz.com"],
              "contact": [{"name": "ZeroLabz Security", "email": "dev@zrolabz.com"}]
            } |
            .components = (.components // []) + [
              {
                "type": "cryptographic-asset",
                "bom-ref": "crypto/ml-kem-512",
                "name": "ML-KEM-512",
                "description": "Vendored PQClean NIST FIPS 203 ML-KEM-512 key encapsulation mechanism (deps/mlkem512)",
                "cryptoProperties": {
                  "assetType": "algorithm",
                  "algorithmProperties": {
                    "primitive": "kem",
                    "parameterSetIdentifier": "512",
                    "executionEnvironment": "software-plain-ram",
                    "implementationPlatform": "x86_64",
                    "cryptoFunctions": ["keygen", "encapsulate", "decapsulate"],
                    "classicalSecurityLevel": 128,
                    "nistQuantumSecurityLevel": 1
                  },
                  "oid": "2.16.840.1.101.3.4.4.1"
                }
              },
              {
                "type": "cryptographic-asset",
                "bom-ref": "crypto/chacha20-poly1305",
                "name": "ChaCha20-Poly1305",
                "description": "Vendored Monocypher 4.0.3 AEAD cipher with 812-byte AAD binding (deps/monocypher)",
                "cryptoProperties": {
                  "assetType": "algorithm",
                  "algorithmProperties": {
                    "primitive": "ae",
                    "parameterSetIdentifier": "256",
                    "cryptoFunctions": ["encrypt", "decrypt", "tag"],
                    "classicalSecurityLevel": 256,
                    "nistQuantumSecurityLevel": 0
                  }
                }
              },
              {
                "type": "cryptographic-asset",
                "bom-ref": "crypto/shake256",
                "name": "SHAKE-256",
                "description": "Domain-separated SHAKE-256 key derivation function (FIPS 202 / deps/mlkem512)",
                "cryptoProperties": {
                  "assetType": "algorithm",
                  "algorithmProperties": {
                    "primitive": "xof",
                    "parameterSetIdentifier": "256",
                    "cryptoFunctions": ["digest", "keyderive"],
                    "classicalSecurityLevel": 256,
                    "nistQuantumSecurityLevel": 0
                  },
                  "oid": "2.16.840.1.101.3.4.2.12"
                }
              }
            ]
          ' cbom.json > cbom.enriched.json
          mv cbom.enriched.json cbom.json

      - name: Validate CBOM against CycloneDX 1.7 schema
        run: |
          set +e
          cdx-validate -i cbom.json
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 3 ]; then
            echo "::warning::cdx-validate reported compliance scorecard findings (exit code 3); schema validation passed."
          elif [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi

      - name: Summarize detected cryptographic assets
        run: |
          jq '[.components[]? | select(.type == "cryptographic-asset") | {
            name,
            assetType: .cryptoProperties.assetType,
            primitive: .cryptoProperties.algorithmProperties.primitive,
            quantumLevel: .cryptoProperties.algorithmProperties.nistQuantumSecurityLevel,
            oid: .cryptoProperties.oid
          }]' cbom.json

      - name: Upload CycloneDX CBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-wire-native-cbom-${{ github.sha }}
          path: cbom.json
          retention-days: 90
